name: Verificar el manual

# Claude Code publica versiones casi a diario. Este flujo comprueba cada
# madrugada que las afirmaciones del libro siguen siendo ciertas contra la
# última versión del CLI, y abre una incidencia cuando alguna deja de serlo.

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC, todos los días
  workflow_dispatch:       # y a mano cuando haga falta
  # Sin filtro de rutas: la fábrica, las plantillas y los entregables también
  # pueden romper el producto, y una lista de rutas siempre se queda corta. Una
  # ejecución cuesta minutos; un fallo que se cuela, mucho más.
  push:
    # Solo ramas. Un push de etiqueta deja el checkout en HEAD desprendido y
    # el paso de commit no tiene dónde publicar.
    branches:
      - main
  # Una PR podía fusionarse sin comprobarse. Ya no.
  pull_request:

# Permiso mínimo en la raíz. Cada trabajo pide lo suyo.
permissions:
  contents: read

# Dos ejecuciones a la vez se pisan al empujar el estado, y la segunda sale roja
# por una carrera y no por una rotura. Pasó el 14 de agosto de 2026: el mismo
# commit dio verde en una ejecución y rojo en otra. No se cancela la que está en
# marcha, porque una verificación a medias no sirve de nada: se encolan.
concurrency:
  group: verificar-el-manual
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Trabajo 1: comprobar. Instala Claude Code desde un script remoto, así que
  # corre en SOLO LECTURA y SIN credenciales persistidas. Si ese script fuera
  # comprometido algún día, aquí no encuentra con qué escribir en el repo.
  # ---------------------------------------------------------------------
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Anotar la versión verificada
        run: |
          echo "VERSION_CLI=$(claude --version)" >> "$GITHUB_ENV"
          echo "Verificando contra $(claude --version)"

      - name: Pasar el verificador
        id: verificador
        continue-on-error: true
        working-directory: D2-verificador
        run: python3 verificar.py

      - name: Comprobar que las salidas derivadas están al día
        id: fabrica
        continue-on-error: true
        run: python3 fabrica/construir.py --comprobar

      - name: Cazar contradicciones entre archivos
        id: coherencia
        continue-on-error: true
        run: python3 fabrica/comprobar-coherencia.py

      - name: Verificar los bloques de código de la guía
        id: ejemplos
        continue-on-error: true
        working-directory: D2-verificador
        run: python3 verificar-ejemplos.py '../guia-21/M*.md'

      - name: Generar la página pública de estado
        if: always()
        working-directory: D2-verificador
        run: python3 generar-estado-web.py

      - name: Publicar el estado como resumen del trabajo
        if: always()
        run: cat D2-verificador/ESTADO.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el estado como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: estado-verificacion
          # SOLO el JSON. El trabajo privilegiado no acepta HTML ni Markdown
          # producidos después de correr el instalador remoto: los regenera él
          # con el código del repositorio, tras validar este JSON.
          path: D2-verificador/estado.json

      - name: Fallar si hubo roturas
        if: >-
          steps.verificador.outcome == 'failure' ||
          steps.ejemplos.outcome == 'failure' ||
          steps.fabrica.outcome == 'failure' ||
          steps.coherencia.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------
  # Trabajo 2: publicar. Solo se ejecuta en la rama principal, nunca en una PR
  # de fuera. NO instala nada remoto: recibe el artefacto del trabajo 1 y ya.
  # Aquí sí hay permiso de escritura, y aquí no hay superficie de ataque.
  # ---------------------------------------------------------------------
  publicar-estado:
    needs: verificar
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: estado-verificacion
          path: D2-verificador

      - name: Validar el JSON y regenerar el estado con código de confianza
        run: python3 D2-verificador/regenerar-desde-estado.py

      - name: Commit del estado solo si cambió la sustancia
        # `estado.json` lleva la fecha de ejecución, así que un `git diff` a secas
        # daría cambios todos los días y ensuciaría el historial con ruido. Se
        # compara la sustancia: versión del CLI y resultado de cada prueba.
        run: |
          if python3 D2-verificador/cambio-sustancial.py; then
            VERSION=$(python3 -c "import json;print(json.load(open('D2-verificador/estado.json'))['cli_verificado'])")
            git config user.name  "verificador"
            git config user.email "verificador@cosasagenticas.com"
            git add D2-verificador/ESTADO.md D2-verificador/estado.json D2-verificador/estado.html
            git commit -m "estado: verificado contra ${VERSION}"
            # Reintento con rebase: si otra ejecución empujó su estado mientras
            # esta corría, el push se rechaza y el workflow sale rojo por una
            # carrera, no por una rotura. Ya pasó el 14 de agosto de 2026 con dos
            # ejecuciones sobre el mismo commit. El grupo de concurrencia lo evita
            # casi siempre; esto cubre el resto.
            for intento in 1 2 3; do
              if git push; then
                echo "Estado publicado en el intento ${intento}."
                exit 0
              fi
              echo "Push rechazado, reintento ${intento}: rebaso sobre el remoto."
              git pull --rebase --autostash origin main || exit 1
              sleep $((intento * 5))
            done
            echo "No se pudo publicar el estado tras 3 intentos." >&2
            exit 1
          else
            echo "Nada que publicar."
          fi

      - name: Abrir incidencia si algo se ha roto
        if: needs.verificar.result == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const informe = JSON.parse(
              fs.readFileSync('D2-verificador/estado.json', 'utf8')
            );
            const rotas = informe.pruebas.filter(p => p.resultado === 'FALLA');
            const cuerpo = [
              `El CLI \`${informe.cli_verificado}\` ha roto ${rotas.length} afirmación(es) del libro.`,
              '',
              ...rotas.map(p =>
                `- **${p.id}** (${p.capitulo}): ${p.afirmacion}\n  - Motivo: ${p.motivo}\n  - Comando: \`${p.comando}\``
              ),
              '',
              'Antes de cerrar esta incidencia hay que: corregir el capítulo, subir la',
              'versión del libro, anotarlo en el changelog y mandarlo al boletín semanal.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rotura con ${informe.cli_verificado}: ${rotas.length} afirmación(es)`,
              body: cuerpo,
              labels: ['rotura', 'manual'],
            });
