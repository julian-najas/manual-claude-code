name: Publicar el companion

# La fábrica es la única que publica. El repositorio del companion es una salida
# inmutable: nada se edita allí a mano, y si alguien lo hace, la siguiente
# publicación lo borra.
#
# Antes esto era un script local. Un script local significa que el sitio depende
# de que alguien se acuerde de ejecutarlo desde su máquina, que es justo lo que
# este proyecto dice que no se hace.

on:
  push:
    branches: [main]
    paths:
      - "guia-21/**"
      - "fabrica/generar-companion.py"
      - "fabrica/resoluciones.yaml"
      - ".github/workflows/publicar-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-companion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # hace falta el historial para que la procedencia registre el commit
          fetch-depth: 0
          persist-credentials: false

      # `resoluciones.yaml` es la segunda fuente canónica del sitio y el generador
      # se niega a publicar sin ella, en vez de sacar un companion a medias que
      # parezca completo.
      - name: Instalar PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Generar el sitio desde las fuentes canónicas
        run: python3 fabrica/generar-companion.py

      - name: Comprobar que no hay enlaces internos rotos
        # el fallo que encontró la auditoría externa: href="./" desde una página
        # de síntoma recarga esa misma página. No vuelve a colarse.
        run: |
          set -euo pipefail
          # `grep` devuelve 1 cuando no encuentra nada, y con pipefail eso tumba
          # el paso justo en el caso bueno. El `|| true` es obligatorio aquí.
          MALOS=$(grep -rl 'href="\./"' companion/ || true)
          if [ -n "$MALOS" ]; then
            echo "Páginas con enlaces relativos rotos:" >&2
            echo "$MALOS" | head -5 >&2
            exit 1
          fi
          N=$(find companion -name index.html | wc -l)
          if [ "$N" -lt 100 ]; then
            echo "Solo $N páginas. Algo ha ido mal, no publico." >&2
            exit 1
          fi
          # Un `resoluciones.yaml` vacío o mal cargado no rompe nada: produce un
          # sitio entero de páginas cortas. Sería una regresión silenciosa, que es
          # la peor clase. Este suelo la convierte en un rojo.
          R=$(grep -rl 'class="pasa"' companion/ | wc -l)
          if [ "$R" -lt 150 ]; then
            echo "Solo $R páginas con resolución completa. Esperaba 150 o más." >&2
            exit 1
          fi
          echo "$N páginas ($R con resolución completa), ningún enlace interno roto."

      - name: Publicar en el repositorio del companion
        env:
          TOKEN: ${{ secrets.COMPANION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            # Sin secreto configurado esto no es un fallo, es un "todavía no".
            # Un workflow permanentemente rojo enseña a la gente a ignorar el rojo,
            # que es peor que no tenerlo.
            echo "::warning::Falta el secreto COMPANION_TOKEN, así que no publico."
            echo "Crea un PAT de alcance fino sobre claude-code-companion con"
            echo "permiso Contents: write y guárdalo como COMPANION_TOKEN."
            echo "Mientras tanto: ./fabrica/publicar-companion.sh desde tu máquina."
            exit 0
          fi
          COMMIT=$(git rev-parse --short HEAD)
          git clone -q "https://x-access-token:${TOKEN}@github.com/julian-najas/claude-code-companion.git" /tmp/pub
          find /tmp/pub -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r companion/. /tmp/pub/
          cd /tmp/pub
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "fabrica"
          git config user.email "fabrica@cosasagenticas.com"
          git commit -q -m "companion: regenerado desde ${COMMIT}"
          git push -q origin HEAD:main
          echo "Publicado desde ${COMMIT}"
