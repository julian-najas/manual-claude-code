# Hechos canónicos
#
# Un hecho vive AQUÍ una sola vez. Todo lo demás lo cita.
#
# El problema que resuelve este archivo es real y ya nos pasó: al corregir que
# MCP difiere sus esquemas de herramientas, parcheé la referencia de una skill
# pero no su SKILL.md, y la contradicción sobrevivió a la corrección. Un
# verificador de afirmaciones no la vio, porque las dos frases estaban en
# archivos distintos y ninguna era una prueba ejecutable.
#
# Cada hecho declara:
#   valor       la formulación canónica, para citarla igual en todas partes
#   fuente      de dónde sale: doc oficial, binario, medición propia
#   prohibido   patrones que lo CONTRADICEN. Si aparecen en cualquier .md del
#               repositorio, `comprobar-coherencia.py` falla.
#   excepto     archivos donde el patrón es legítimo, por ejemplo cuando el
#               texto documenta el error para explicarlo.

hechos:

  - id: MCP-DIFERIDO
    valor: "Por defecto solo se cargan los nombres de las herramientas MCP; los esquemas van diferidos y se traen bajo demanda con tool search."
    fuente: "code.claude.com/docs/en/mcp.md y context-window.md, 12-ago-2026"
    prohibido:
      - "MCP mete sus definiciones"
      - "todas sus definiciones de herramientas, siempre"
      - "con todas sus definiciones de herramientas dentro"
      - "las dos únicas piezas que cobran en cada turno"
    excepto:
      - "guia-21/M21-retiradas-y-cambios.md"
      - "entregables/AUDITORIA.md"
      - "fabrica/hechos.yaml"

  - id: MODOS-SEIS
    valor: "Hay seis modos de permisos: default (Manual), acceptEdits, plan, auto, dontAsk y bypassPermissions."
    fuente: "code.claude.com/docs/en/permission-modes.md, 12-ago-2026"
    prohibido:
      - "los cinco modos de permisos"
      - "cinco modos, uno a uno"
    excepto:
      - "guia-21/M5-permisos-y-seguridad.md"
      - "guia-21/FASE-1-indice.md"
      - "entregables/AUDITORIA.md"
      - "fabrica/hechos.yaml"

  - id: CACHE-OCHO
    valor: "Ocho acciones invalidan la caché, incluida denegar una herramienta entera."
    fuente: "code.claude.com/docs/en/prompt-caching.md, 12-ago-2026"
    prohibido:
      - "siete invalidadores"
    excepto:
      # el M15 y la auditoría DESCRIBEN la corrección: ahí el patrón es legítimo.
      # Basta declararlo sobre la fuente canónica: las copias generadas no se revisan.
      - "guia-21/M15-modelos-coste-observabilidad.md"
      - "entregables/AUDITORIA.md"
      - "entregables/PENDIENTE-VERIFICAR.md"
      - "fabrica/hechos.yaml"

  - id: RATIO-ENTRADA-SALIDA
    valor: "24 tokens de entrada por cada token de salida, medido sobre 4.195 llamadas propias."
    fuente: "telemetría propia, 10-abr a 12-ago-2026, D4-factura/analizar_gasto.py"
    prohibido: []

  - id: CORTESIA
    valor: "Cada confirmación de una palabra costó 7.891 tokens de entrada para devolver 34."
    fuente: "telemetría propia, misma serie"
    prohibido: []

  - id: AUTO-MEMORY-LIMITE
    valor: "De MEMORY.md se cargan las primeras 200 líneas o 25 KB, lo que llegue antes."
    fuente: "code.claude.com/docs/en/how-claude-code-works.md y memory.md"
    prohibido: []

  - id: SKILLS-COMPACTAR
    valor: "Al compactar se reenganchan las skills conservando 5.000 tokens de cada una, con un presupuesto conjunto de 25.000."
    fuente: "code.claude.com/docs/en/skills.md"
    prohibido: []

  - id: SUBAGENTES-TOPE
    valor: "No hay tope total de subagentes por sesión: se eliminó en la semana 32. Siguen la concurrencia (20 por defecto) y la profundidad."
    fuente: "whats-new/2026-w32.md"
    prohibido:
      - "tope de 200 subagentes por sesión sigue"
      - "hay un límite de 200 subagentes"
    excepto:
      - "fabrica/hechos.yaml"

  - id: IDIOMA-NO-ES-DIFERENCIAL
    valor: "173 de las 187 páginas oficiales existen en castellano, el 92,5 %. El diferencial no es el idioma: es la verificación contra el binario, y llegar a lo nuevo antes que la traducción oficial."
    fuente: "medición propia sobre las 187, evidencias/EXP-002, 13-ago-2026"
    prohibido:
      - "la única guía en español"
      - "no existe documentación oficial en español"
      # el muestreo de 16 páginas queda superado por la medición completa
      - "14 de 16 páginas"
      - "de una muestra de 16"
    excepto:
      - "evidencias/EXP-002-cobertura-castellano.md"
      - "fabrica/hechos.yaml"

  - id: TRADUCCION-VA-DETRAS
    valor: "Las 14 páginas sin traducir son casi todas de lo más reciente: los seis archivos de entornos self-hosted, la mensajería entre sesiones, Claude Tag, Actions con proveedores cloud y los digests de las semanas 30 y 32."
    fuente: "medición propia, evidencias/EXP-002, 13-ago-2026"
    prohibido: []

  - id: DOS-PRODUCTOS
    valor: "La guía de referencia de 21 módulos está terminada. El manual guiado de 12 módulos está en obra: 9 de 12."
    fuente: "estado del repositorio"
    prohibido:
      - "el manual profesional está terminado"
      - "los 12 módulos del manual, completos"
    excepto:
      - "fabrica/hechos.yaml"

  - id: TOOL-SEARCH-NO-ES-SOLO-MCP
    valor: "Apagar tool search cuesta unos 17.000 tokens de entrada por turno aunque no haya ningún servidor MCP conectado, porque los esquemas de las herramientas propias del CLI también van diferidos."
    fuente: "medición propia 24-ago-2026 con la 2.1.241 (MCP-010)"
    prohibido:
      - "tool search solo afecta a MCP"
      - "sin servidores MCP da igual tool search"
    excepto:
      - "fabrica/hechos.yaml"

  - id: EL-CLAUDE-MD-LLEGA-AL-SUBAGENTE
    valor: "La jerarquía de memoria entera se carga también en cada subagente, salvo en los integrados de exploración y de plan, así que una frase del CLAUDE.md que declare unos fallos ya conocidos los borra del informe del revisor."
    fuente: "medición propia 26-ago-2026 con la 2.1.246 y Sonnet 5 (SUB-010) y code.claude.com/docs/en/sub-agents.md"
    prohibido:
      - "el subagente arranca sin nada de tu sesión"
      - "un subagente no ve tu CLAUDE.md"
    excepto:
      - "fabrica/hechos.yaml"

  - id: EL-AISLAMIENTO-NO-ES-CRITERIO
    valor: "Un subagente revisor aislado, con contrato de auditor pero sin criterio de aceptación propio, encuentra lo mismo que el agente principal y cuesta el doble; lo que cambia el hallazgo es escribir las preguntas que el informe está obligado a contestar."
    fuente: "medición propia 26-ago-2026 con la 2.1.246 y Sonnet 5, dos repeticiones por condición"
    prohibido:
      - "un subagente revisor da una segunda opinión por sí solo"
      - "delegar la revisión sale más barato"
    excepto:
      - "fabrica/hechos.yaml"

  - id: HOOKS-CORREN-SIN-CONFIANZA
    valor: "En claude -p y desde el SDK no hay diálogo de confianza y la carpeta se trata como de confianza, así que los hooks declarados en el settings.json de un repositorio se ejecutan aunque nunca hayas confiado en él; las reglas allow del mismo archivo, en cambio, se ignoran."
    fuente: "medición propia 24-ago-2026 con la 2.1.241 (HOK-012) y code.claude.com/docs/en/hooks.md"
    prohibido:
      - "los hooks de un repositorio no se ejecutan hasta que aceptas"
      - "sin confianza no corre nada del repositorio"
    excepto:
      - "fabrica/hechos.yaml"

  - id: ALLOW-NECESITA-CONFIANZA
    valor: "Las reglas permissions.allow del settings.json de un proyecto no se aplican hasta aceptar el diálogo de confianza del espacio de trabajo; las de deny y ask se aplican siempre."
    fuente: "medición propia 19-ago-2026 con la 2.1.235 (PRM-008) y code.claude.com/docs/en/permissions.md"
    prohibido:
      - "los permisos del repositorio se aplican siempre"
      - "basta con confirmar el settings.json en git"
    excepto:
      - "fabrica/hechos.yaml"

  - id: SKILL-DISPARO-SINTOMA
    valor: "Lo que decide que una skill se dispare sola no es la calidad de la descripción sino que el disparo esté escrito con las palabras del síntoma: con una petición que nombra la tarea se dispara hasta con una descripción de catálogo, y con una que cuenta un síntoma solo se dispara si el síntoma está en when_to_use."
    fuente: "medición propia 25-ago-2026 con la 2.1.245, veinticuatro ejecuciones (SKL-005)"
    prohibido:
      - "una descripción bien escrita basta para que la skill se dispare"
      - "la descripción documenta lo que la skill hace"
    excepto:
      - "fabrica/hechos.yaml"

  - id: COMANDOS-SON-SKILLS
    valor: "Los comandos personalizados se han fusionado con las skills: un archivo en .claude/commands/ y una skill del mismo nombre crean el mismo comando y funcionan igual, y si coinciden gana la skill."
    fuente: "code.claude.com/docs/en/skills.md y comprobación propia 25-ago-2026 con la 2.1.245 (SKL-009)"
    prohibido:
      - "hay que elegir entre un comando y una skill"
      - "los comandos y las skills son piezas distintas"
    excepto:
      - "guia-21/M7-extension.md"
      - "guia-21/FASE-1-indice.md"
      - "entregables/AUDITORIA.md"
      - "fabrica/hechos.yaml"

  - id: CONFIG-NINGUNO-SE-USA
    valor: "En el laboratorio gestor-pedidos ni config.py ni settings.py se importan: app.py fija sus valores a mano. La respuesta a 'cuál manda' es ninguno de los dos."
    fuente: "lectura del código y prueba de realidad, evidencias/EXP-003, 13-ago-2026"
    prohibido:
      - "La configuración efectiva es `settings.py`"
      - "la configuración efectiva es settings.py"
    excepto:
      - "guia-21/M20-playbooks.md"
      - "evidencias/EXP-003-prueba-realidad-20.2.md"
      - "fabrica/hechos.yaml"
