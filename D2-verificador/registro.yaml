    espera_salida: 0
    espera_patron: '"isError": true'
    nota: "Segundo candado de los tres. La sentencia se valida por su forma antes de abrir conexión, así que esta prueba pasa incluso en un clon sin base de datos construida."

  - id: MCP-005
    capitulo: "06 · MCP"
    afirmacion: "El servidor rechaza una segunda sentencia escondida detrás de un punto y coma, que es la vía clásica para colar un UPDATE tras un SELECT."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "CLAUDE_PROJECT_DIR=$PWD python3 mcp/servidor-pedidos.py < mcp/ejemplos/segunda-sentencia.jsonl"]
