    nota: "El apretón de manos completo y el catálogo de las tres herramientas. Si el servidor imprimiera cualquier cosa que no sea JSON-RPC por la salida estándar, el transporte se rompería y esta prueba lo caza."

  - id: MCP-004
    capitulo: "06 · MCP"
