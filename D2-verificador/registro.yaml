    espera_patron: '"isError": true'
    nota: "Un filtro que solo mirara la primera palabra dejaría pasar esto. Por eso el candado dos son dos comprobaciones y no una."

  - id: MCP-006
    capitulo: "06 · MCP"
    afirmacion: "El servidor responde a una consulta legítima con los datos de la base, y el laboratorio se reconstruye desde el esquema versionado."
    tipo: cli
