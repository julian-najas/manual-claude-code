  - id: MCP-003
    capitulo: "06 · MCP"
    afirmacion: "Un servidor MCP por stdio se puede escribir sin dependencias: basta con responder initialize y tools/list en JSON-RPC por la entrada y salida estándar."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "CLAUDE_PROJECT_DIR=$PWD python3 mcp/servidor-pedidos.py < mcp/ejemplos/handshake.jsonl"]
    espera_salida: 0
    espera_patron: '(?s)(?=.*pedidos-solo-lectura)(?=.*listar_tablas)(?=.*describir_tabla)(?=.*consultar)'
    nota: "El apretón de manos completo y el catálogo de las tres herramientas. Si el servidor imprimiera cualquier cosa que no sea JSON-RPC por la salida estándar, el transporte se rompería y esta prueba lo caza."

  - id: MCP-004
