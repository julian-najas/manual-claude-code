# Registro de afirmaciones verificables del manual
#
# Cada entrada es una AFIRMACIÓN que el libro hace, y la prueba que la sostiene.
# Si una afirmación no está aquí, no puede entrar en el libro.
#
# tipo:
#   cli      -> ejecuta un comando y comprueba código de salida y/o patrón en la salida
#   fichero  -> comprueba que una ruta existe (directorio o archivo)
#   manual   -> solo un humano puede comprobarlo, se reporta como REVISAR
#
# coste: true  -> la prueba gasta tokens de verdad. No se ejecuta salvo con --con-coste
# destructivo: true -> nunca se ejecuta, se documenta y se reporta como OMITIDO

meta:
  libro: "Claude Code en producción"
  version_libro: "v2026.08"

pruebas:

  - id: CLI-001
    capitulo: "02 · Instalación y autenticación"
    afirmacion: "El binario responde a --version y devuelve una versión semántica."
    tipo: cli
    comando: ["claude", "--version"]
    espera_patron: '\d+\.\d+\.\d+'

  - id: CLI-002
    capitulo: "02 · Instalación y autenticación"
    afirmacion: "claude doctor comprueba la salud de la instalación sin abrir sesión."
    tipo: cli
    comando: ["claude", "doctor"]
    espera_salida: 0

  - id: CLI-003
    capitulo: "02 · Instalación y autenticación"
    afirmacion: "claude setup-token crea un token de larga duración para suscriptores."
    tipo: cli
    comando: ["claude", "--help"]
    espera_patron: 'setup-token'

  # ---------------------------------------------------------------------
  # Módulo 02. Las tres de arriba son las del esqueleto; las de abajo se
  # añaden el 17-ago-2026 al escribir el módulo, por la regla de la casa: si
  # el texto afirma algo comprobable, aquí está el comando que lo comprueba.
  # ---------------------------------------------------------------------

  - id: CLI-004
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "claude doctor informa del método de instalación, del canal de actualización y del resultado del último intento."
    tipo: cli
    comando: ["claude", "doctor"]
    espera_salida: 0
    espera_patron: 'Config install method[\s\S]*Auto-update channel[\s\S]*Last update attempt'
    nota: "Se comprueba que las líneas existen, no su redacción exacta: la salida de doctor es diagnóstico, no interfaz estable."

  - id: CLI-005
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "claude install acepta como destino un canal o un número de versión concreto, que es la vía para reproducir un fallo ajeno."
    tipo: cli
    comando: ["claude", "install", "--help"]
    espera_salida: 0
    espera_patron: 'stable,\s+latest, or specific version'

  - id: CLI-006
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "claude auth gestiona el inicio de sesión y expone status, que dice qué credencial está activa sin abrir sesión."
    tipo: cli
    comando: ["claude", "auth", "--help"]
    espera_salida: 0
    espera_patron: 'status'
    nota: "Se comprueba contra --help a propósito. Ejecutar `claude auth status` volcaría el correo y el orgId de la cuenta a estado.json, que es público."

  - id: CLI-007
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "La instalación nativa deja en el PATH un enlace simbólico a una versión concreta bajo ~/.local/share/claude/versions/, y por eso conviven varias versiones en disco."
    tipo: cli
    comando: ['bash', '-c', 'L="$HOME/.local/bin/claude"; if [ -L "$L" ]; then readlink "$L" | grep -q "/.local/share/claude/versions/" && echo LANZADOR-ES-ENLACE-A-VERSIONS || echo ENLACE-A-OTRO-SITIO; else echo NO-APLICA-SIN-INSTALACION-NATIVA; fi']
    espera_salida: 0
    espera_patron: 'LANZADOR-ES-ENLACE-A-VERSIONS|NO-APLICA-SIN-INSTALACION-NATIVA'
    nota: "La afirmación es sobre la instalación NATIVA. Donde no la hay, la prueba no aplica y lo dice, en vez de dar un rojo que nadie puede arreglar: pasó el 17-ago-2026 en el sandbox de la rutina, donde el binario vive en /opt/claude-code/bin. Si hay enlace y apunta a otro sitio, eso sí es FALLA."

  - id: CLI-008
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "claude doctor termina con código 0 aunque reporte ajustes inválidos: el código de salida no sirve como comprobación de configuración."
    tipo: cli
    comando: ['bash', '-c', 'd=$(mktemp -d); mkdir -p "$d/.claude"; echo "{" > "$d/.claude/settings.json"; cd "$d"; claude doctor > out.txt 2>&1; c=$?; grep -q "Invalid settings" out.txt && [ "$c" = "0" ] && echo AJUSTES-INVALIDOS-Y-SALIDA-CERO; rm -f "$d/out.txt" "$d/.claude/settings.json"; rmdir "$d/.claude" "$d"']
    espera_salida: 0
    espera_patron: 'AJUSTES-INVALIDOS-Y-SALIDA-CERO'
    nota: "Es la afirmación central del laboratorio del módulo 02. Si algún día doctor pasa a salir con código distinto de 0, esta prueba falla y hay que reescribir el paso 6, que es justo lo que queremos."

  - id: CLI-009
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "La documentación oficial condiciona comportamiento a versiones concretas del CLI: authentication.md cita seis o más."
    tipo: cli
    comando: ['bash', '-c', 'D=$(curl -fsS --max-time 25 https://code.claude.com/docs/en/authentication.md 2>/dev/null) || { echo SIN-RED; exit 0; }; printf "%s" "$D" | grep -oE "v2[.]1[.][0-9]+" | sort -u | wc -l']
    espera_salida: 0
    red: true
    espera_patron: '^\s*([6-9]|[1-9][0-9]+)\s*$'
    nota: "El 17-ago-2026 daban 8 versiones distintas en authentication.md, y 14 sumando setup.md y troubleshoot-install.md. El umbral es 6 para que la prueba mida la afirmación del libro y no el recuento exacto de un día."

  - id: CLI-010
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "El binario acepta un tercer canal de publicación, rc, que la documentación oficial no menciona."
    tipo: manual
    nota: "Comprobado el 17-ago-2026 con la 2.1.233. Poniendo un autoUpdatesChannel inválido en un settings.json, claude doctor contesta: Expected one of latest, stable, rc. Y rc no aparece ni en setup.md ni en settings.md descargadas ese mismo día. Se deja manual a propósito: automatizarlo exige comillas dobles dentro del comando, y el lector de YAML sin dependencias del verificador las deja escapadas, así que pasaría en local con PyYAML y fallaría en CI sin él. Es la misma clase de fallo que documenta REPO-001. Se revisa cada trimestre; el día que se documente, deja de ser una caja de aviso y pasa a ser una sección."

  - id: AUT-001
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "El orden de precedencia de credenciales tiene siete niveles, y una sesión de pasarela de aplicaciones de Claude queda por encima de los siete."
    tipo: manual
    nota: "Eran cuatro en el material propio del 12-ago-2026 y son siete en authentication.md del 17-ago-2026. Es una lista que crece: se recuenta contra la documentación oficial en cada revisión trimestral, no se copia de una edición anterior."

  - id: ENT-001
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "El laboratorio del módulo 02 deja los mandos del proyecto versionados en gestor-pedidos."
    tipo: cli
    comando: ["test", "-f", ".claude/settings.json"]
    directorio: "D6-repo-feo/gestor-pedidos"
    espera_salida: 0

  - id: ENT-002
    capitulo: "02 · Instalación, autenticación y versiones"
    afirmacion: "El laboratorio del módulo 02 deja la versión del CLI anotada en el repositorio, no en la cabeza de nadie."
    tipo: cli
    comando: ["grep", "-qE", "[0-9]+[.][0-9]+[.][0-9]+", "ENTORNO.md"]
    directorio: "D6-repo-feo/gestor-pedidos"
    espera_salida: 0

  - id: CTX-001
    capitulo: "03 · Memoria y contexto"
    afirmacion: "--add-dir da acceso a directorios fuera del proyecto actual."
    tipo: cli
    comando: ["claude", "--help"]
    espera_patron: '--add-dir'

  - id: CTX-002
    capitulo: "03 · Memoria y contexto"
    afirmacion: "--autocompact controla el tamaño de la ventana antes de compactar."
    tipo: cli
    comando: ["claude", "--help"]
    espera_patron: '--autocompact'

  - id: CTX-003
    capitulo: "03 · Memoria y contexto"
    afirmacion: "--bare arranca sin CLAUDE.md, sin hooks y sin plugins, para depurar contexto."
    tipo: cli
    comando: ["claude", "--help"]
    espera_patron: '--bare'

  # ---------------------------------------------------------------------
  # Módulo 03. Las tres de arriba son las del esqueleto; las de abajo se
  # añaden el 18-ago-2026 al escribir el módulo.
  # ---------------------------------------------------------------------

  - id: CTX-004
    capitulo: "03 · Memoria y contexto"
    afirmacion: "El modo mínimo se salta el descubrimiento automático de CLAUDE.md, además de hooks, plugins y auto memory."
    tipo: cli
    comando: ["claude", "--help"]
    espera_salida: 0
    espera_patron: 'CLAUDE.md auto-discovery'

  - id: CTX-005
    capitulo: "03 · Memoria y contexto"
    afirmacion: "El laboratorio del módulo 03 deja un CLAUDE.md en la raíz de gestor-pedidos."
    tipo: cli
    comando: ["test", "-f", "CLAUDE.md"]
    directorio: "D6-repo-feo/gestor-pedidos"
    espera_salida: 0

  - id: CTX-006
    capitulo: "03 · Memoria y contexto"
    afirmacion: "El CLAUDE.md del laboratorio declara por escrito que no hay ningún archivo de configuración en uso, que es la respuesta correcta y no la intuitiva."
    tipo: cli
    comando: ["grep", "-q", "No hay archivo de configuración en uso", "CLAUDE.md"]
    directorio: "D6-repo-feo/gestor-pedidos"
    espera_salida: 0
    nota: "Es el criterio PASA del módulo. Si alguien reescribe el CLAUDE.md diciendo que manda settings.py, esta prueba se pone roja, que es exactamente lo que queremos."

  - id: CTX-007
    capitulo: "03 · Memoria y contexto"
    afirmacion: "En gestor-pedidos ningún archivo importa config, settings ni utils: los tres módulos están muertos y app.py fija sus valores a mano."
    tipo: cli
    comando: ['bash', '-c', 'n=$(grep -rlE "^(import|from) (config|settings|utils)" --include=*.py . | wc -l); [ "$n" = "0" ] && echo NADIE-IMPORTA-LOS-TRES || echo ALGUIEN-LOS-IMPORTA']
    directorio: "D6-repo-feo/gestor-pedidos"
    espera_salida: 0
    espera_patron: 'NADIE-IMPORTA-LOS-TRES'
    nota: "Sostiene el hecho canónico CONFIG-NINGUNO-SE-USA. La guía de doma lo lista como fallo 8 y se queda corta: utils.py entero está muerto, calcular_iva() incluida."

  - id: CTX-008
    capitulo: "03 · Memoria y contexto"
    afirmacion: "El endpoint muerto de gestor-pedidos sigue expuesto y lee la tabla pedidos_2019."
    tipo: cli
    comando: ["grep", "-q", "pedidos_2019", "app.py"]
    directorio: "D6-repo-feo/gestor-pedidos"
    espera_salida: 0

  - id: CTX-009
    capitulo: "03 · Memoria y contexto"
    afirmacion: "El binario conoce las tres claves de memoria del módulo: claudeMdExcludes, autoMemoryEnabled y autoMemoryDirectory."
    tipo: cli
    comando: ['bash', '-c', 'd=$(mktemp -d); mkdir -p "$d/.claude"; printf "%b" "{\0042claudeMdExcludes\0042: 5, \0042autoMemoryEnabled\0042: 7, \0042autoMemoryDirectory\0042: 9}" > "$d/.claude/settings.json"; cd "$d"; claude doctor 2>&1 | grep -cE "claudeMdExcludes|autoMemoryEnabled|autoMemoryDirectory" > c.txt; echo CLAVES-RECONOCIDAS=$(cat c.txt); rm -rf "$d"']
    espera_salida: 0
    espera_patron: 'CLAVES-RECONOCIDAS=3'
    nota: "Se comprueba metiendo valores del tipo equivocado y contando cuántas claves reporta doctor como inválidas. Que las reporte demuestra que las conoce. El JSON se escribe con escapes octales para no meter una barra invertida antes de una comilla, que es lo que rompe el lector de YAML sin dependencias."

  - id: CTX-010
    capitulo: "03 · Memoria y contexto"
    afirmacion: "La documentación oficial fija el objetivo de tamaño de un CLAUDE.md por debajo de 200 líneas."
    tipo: cli
    comando: ['bash', '-c', 'D=$(curl -fsS --max-time 25 https://code.claude.com/docs/en/memory.md 2>/dev/null) || { echo SIN-RED; exit 0; }; printf "%s" "$D" | grep -c "under 200 lines"']
    espera_salida: 0
    red: true
    espera_patron: '^\s*[1-9]'

  - id: CTX-011
    capitulo: "03 · Memoria y contexto"
    afirmacion: "El CLAUDE.md de la raíz y las reglas sin paths se releen del disco y se reinyectan tras compactar; las reglas con paths y los CLAUDE.md anidados no."
    tipo: cli
    comando: ['bash', '-c', 'D=$(curl -fsS --max-time 25 https://code.claude.com/docs/en/context-window.md 2>/dev/null) || { echo SIN-RED; exit 0; }; printf "%s" "$D" | grep -c "Re-injected from disk"']
    espera_salida: 0
    red: true
    espera_patron: '^\s*[1-9]'
    nota: "Es la tabla que sostiene la sección 3.2.4 y el runbook entero. Dos coincidencias el 18-ago-2026: el CLAUDE.md de la raíz y la auto memory."

  - id: CTX-012
    capitulo: "03 · Memoria y contexto"
    afirmacion: "Un CLAUDE.md de 66 líneas costó 1.178 tokens de entrada por turno, y 40 líneas de notas dentro de un comentario HTML costaron exactamente cero."
    tipo: manual
    coste: true
    nota: "Medido el 18-ago-2026 con la 2.1.234 sobre D6-repo-feo/gestor-pedidos. Método: misma petición trivial, mismo repo, variando solo el archivo, con claude -p y --output-format json, sumando input_tokens, cache_creation_input_tokens y cache_read_input_tokens. Dos repeticiones por medida, las dos idénticas. Suelo sin archivo 42.302; con el archivo 43.480; con 40 líneas más dentro de comentario HTML 43.480, el mismo número exacto; con esas 40 líneas visibles 46.720. Se deja manual porque automatizarla gasta tokens de verdad y porque las cifras dependen de la máquina y del modelo: lo que se revisa cada trimestre es el método y el orden de magnitud, no el número."

  - id: CTX-013
    capitulo: "03 · Memoria y contexto"
    afirmacion: "Con inicio de sesión de suscripción, el modo mínimo no autentica, y el mensaje de error habla de red en vez de credenciales."
    tipo: manual
    nota: "Comprobado el 18-ago-2026 con la 2.1.234. claude -p con --bare devuelve: Authentication error, This may be a temporary network issue, please try again. Es coherente con lo documentado en el módulo 02: con --bare la autenticación es estrictamente ANTHROPIC_API_KEY o apiKeyHelper y no se lee el OAuth guardado ni el llavero. Consecuencia para el módulo 03: quien no tenga clave de API no puede usar el modo mínimo como herramienta de diagnóstico y tiene que apartar el CLAUDE.md a mano. Se revisa cuando cambie el mensaje de error."

  - id: PRM-001
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "--allowedTools acepta una lista de herramientas permitidas."
    tipo: cli
    comando: ["claude", "--help"]
    espera_patron: '--allowedTools|--allowed-tools'

  - id: PRM-002
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "Existe una bandera para saltarse todos los permisos, y la documentación la marca como peligrosa."
    tipo: cli
    comando: ["claude", "--help"]
    espera_patron: '--dangerously-skip-permissions'

  - id: PRM-003
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "El archivo de ajustes de usuario vive en ~/.claude/settings.json."
    tipo: fichero
    ruta: "~/.claude"

  # ---------------------------------------------------------------------
  # Módulo 04. Las tres de arriba son las del esqueleto; las de abajo se
  # añaden el 19-ago-2026 al escribir el módulo, por la regla de la casa: si
  # el texto afirma algo comprobable, aquí está el comando que lo comprueba.
  # ---------------------------------------------------------------------

  - id: PRM-004
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "La bandera --permission-mode enumera los seis modos, y al modo por defecto lo llama manual."
    tipo: cli
    comando: ["claude", "--permission-mode", "zzz", "-p", "x"]
    espera_salida: 1
    espera_patron: 'acceptEdits, auto, bypassPermissions, manual, dontAsk, plan'
    nota: "Se provoca el error a propósito: es la única forma de que el binario enumere lo que acepta. Si la lista cambia, el patrón falla, que es justo lo que queremos."

  - id: PRM-005
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "El esquema de configuración enumera los mismos seis modos, y ahí el nombre del primero es default y no manual."
    tipo: cli
    directorio: "D2-verificador/sonda-esquema"
    comando: ["claude", "doctor"]
    espera_patron: '"acceptEdits", "auto", "bypassPermissions", "default", "dontAsk", "plan"'
    nota: "Corre sobre la sonda de esquema, cuyo settings.json es inválido a propósito. Los dos sitios aceptan las dos palabras; cada mensaje de error enseña solo una."

  - id: PRM-006
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "Las claves sandbox.enabled, sandbox.network.strictAllowlist y autoMode.environment existen en el esquema del binario instalado, no solo en la documentación."
    tipo: cli
    directorio: "D2-verificador/sonda-esquema"
    comando: ["claude", "doctor"]
    espera_patron: '(?s)(?=.*sandbox\.enabled)(?=.*sandbox\.network\.strictAllowlist)(?=.*autoMode\.environment)'
    nota: "Una clave con el nombre mal escrito no se reporta, así que si su línea sale en Invalid settings es que el binario la conoce."

  - id: PRM-007
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "claude auto-mode defaults imprime las cuatro listas del clasificador en JSON."
    tipo: cli
    comando: ["claude", "auto-mode", "defaults"]
    espera_salida: 0
    espera_patron: '"hard_deny"'
    nota: "El módulo publica los recuentos del 19-ago-2026 con la 2.1.235: 17 allow, 66 soft_deny, 1 hard_deny y 20 environment, 63.477 bytes. Los recuentos se revisan cada trimestre; esta prueba solo vigila que la orden siga existiendo y devolviendo las cuatro listas."

  - id: PRM-008
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "Las reglas permissions.allow del settings.json de un proyecto se ignoran hasta aceptar el diálogo de confianza, y el aviso sale por la salida de error."
    tipo: manual
    coste: true
    nota: "Medido el 19-ago-2026 con la 2.1.235 sobre D6-repo-feo/gestor-pedidos. Misma petición (crear un archivo vacío con touch), misma regla Bash(touch *), dos repeticiones por fila, variando solo de dónde se lee el permiso. Desde permissions.allow del proyecto sin confianza: NO se crea el archivo, 131.788 y 131.806 tokens de entrada y 3 turnos. Desde la bandera --allowedTools: sí, 87.452 tokens y 2 turnos. Desde el mismo archivo con hasTrustDialogAccepted puesto a true: sí, 87.456 y 2 turnos. El aviso literal es: Ignoring 1 permissions.allow entry from .claude/settings.json: this workspace has not been trusted. Se deja manual porque gasta tokens de verdad y porque exige tocar ~/.claude.json. Lo que se revisa cada trimestre es el comportamiento, no los tokens exactos."

  - id: PRM-009
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "Una regla deny de Read bloquea cat y no bloquea a un subproceso que abra el mismo archivo por su cuenta."
    tipo: manual
    coste: true
    nota: "Medido el 19-ago-2026 con la 2.1.235 sobre D6-repo-feo/gestor-pedidos, con deny Read(./secretos/**) puesto en el settings.json del proyecto y --allowedTools Bash. Dos repeticiones por comando. cat secretos/pasarela.env: bloqueado las dos veces, y el agente lo dice en la respuesta. python3 -c print(open(...).read()) sobre el mismo archivo: imprimió la clave entera las dos veces. Es coherente con la documentación: las reglas Read y Edit cubren las herramientas de archivo y los comandos de lectura que Claude Code reconoce en Bash, no los subprocesos arbitrarios. Se revisa cuando cambie la lista de comandos reconocidos."

  - id: PRM-010
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "Las reglas de permisos no ocupan contexto: 24 reglas deny cuestan exactamente los mismos tokens de entrada que ninguna."
    tipo: manual
    coste: true
    nota: "Medido el 19-ago-2026 con la 2.1.235 sobre D6-repo-feo/gestor-pedidos. Misma petición trivial (Responde solo con la palabra OK.), con claude -p y --output-format json, sumando input_tokens, cache_creation_input_tokens y cache_read_input_tokens. Sin bloque de permisos: 43.619 y 43.619. Con 24 reglas deny: 43.619 y 43.619. Antes de publicarlo se comprobó que ese archivo de 24 reglas se estaba aplicando de verdad, pidiendo el archivo de secretos y viendo el bloqueo: si no, el número idéntico probaría lo contrario de lo que parece."

  - id: PRM-011
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "--dangerously-skip-permissions se niega a arrancar como root o con sudo en Linux y macOS."
    tipo: manual
    nota: "Comprobado el 19-ago-2026 con la 2.1.235 en el sandbox de la nube, que corre como root: el mensaje es --dangerously-skip-permissions cannot be used with root/sudo privileges for security reasons. No se automatiza porque el resultado depende del usuario que ejecute el verificador: en una máquina normal la orden arrancaría y la prueba daría falso rojo. La comprobación se salta sola dentro de un sandbox reconocido, que es la razón de que el contenedor de referencia corra como usuario no root."

  - id: PRM-012
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "Los tres perfiles de permisos del módulo están escritos y disponibles."
    tipo: fichero
    ruta: "entregables/plantillas/permisos"

  - id: PRM-013
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "La plantilla de contenedor de desarrollo con red restringida está escrita."
    tipo: fichero
    ruta: "entregables/plantillas/devcontainer/devcontainer.json"

  - id: PRM-014
    capitulo: "04 · Permisos y sandbox"
    afirmacion: "El laboratorio deja versionada la regla que prohíbe leer el directorio de secretos."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["python3", "-c", 'import json,sys; d=json.load(open(".claude/settings.json")); sys.exit(0 if "Read(./secretos/**)" in d["permissions"]["deny"] else 1)']
    espera_salida: 0
    nota: "Vigila que nadie afloje el laboratorio sin darse cuenta. Comprueba la regla, no el comportamiento: el comportamiento lo sostiene PRM-009."

