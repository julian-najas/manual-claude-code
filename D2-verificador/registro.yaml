  # ---------------------------------------------------------------------
  # Módulo 05. HOK-001 es la del esqueleto; las de abajo se añaden el
  # 24-ago-2026 al escribir el módulo contra la 2.1.241.
  #
  # Las cinco primeras corren los hooks del laboratorio EN SECO, con las
  # fixtures de hooks/ejemplos/. Es la técnica que enseña 5.3.3 convertida en
  # prueba permanente: un hook es un programa que lee JSON y escribe JSON, y
  # eso se comprueba sin gastar un token.
  # ---------------------------------------------------------------------

  - id: HOK-002
    capitulo: "05 · Hooks"
    afirmacion: "Un hook PreToolUse puede denegar una llamada devolviendo permissionDecision deny en la salida estándar, sin usar el código de salida 2."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "hooks/veto-secretos.sh < hooks/ejemplos/lectura-de-secreto.json"]
    espera_salida: 0
    espera_patron: '"permissionDecision": "deny"'
    nota: "Prueba en seco del hook del laboratorio con la fixture de una lectura bajo secretos/. Comprueba la forma del contrato, que es lo que envejece; el efecto sobre una sesión de verdad lo cubre HOK-013, que gasta tokens."

  - id: HOK-003
    capitulo: "05 · Hooks"
    afirmacion: "Un hook que no tiene nada que vetar sale con código 0 y sin imprimir nada, y así deja seguir el flujo normal de permisos."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "hooks/veto-secretos.sh < hooks/ejemplos/lectura-inocua.json | grep -q deny"]
    espera_salida: 1
    nota: "El grep no encuentra nada y por eso el código esperado es 1. Un hook que denegara aquí sería peor que no tener hook: bloquearía la lectura de app.py."

  - id: HOK-004
    capitulo: "05 · Hooks"
    afirmacion: "Un hook puede decidir mirando el CONTENIDO que se va a escribir, cosa que una regla de permisos no puede hacer porque protege rutas."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "hooks/veto-credenciales.sh < hooks/ejemplos/escritura-con-credencial.json"]
    espera_salida: 0
    espera_patron: '"permissionDecision": "deny"'
    nota: "La fixture escribe una clave en config/produccion.yaml, una ruta que ninguna regla deny del módulo 04 cubre. Es la frase con la que cerraba el módulo 04 convertida en prueba."

  - id: HOK-005
    capitulo: "05 · Hooks"
    afirmacion: "El veto por contenido deja pasar un archivo sin credenciales dentro."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "hooks/veto-credenciales.sh < hooks/ejemplos/escritura-inocua.json | grep -q deny"]
    espera_salida: 1
    nota: "El contrapeso de HOK-004. Un veto por contenido se equivoca alguna vez, y esta prueba es la que avisa el día que el patrón se vuelva tan ancho que bloquee un archivo de texto normal."

  - id: HOK-006
    capitulo: "05 · Hooks"
    afirmacion: "El hook de formateo sale con código 0 cuando lo editado no es Python, en vez de romper el turno."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "hooks/formatear.sh < hooks/ejemplos/edicion-no-python.json"]
    espera_salida: 0
    nota: "Un hook de comodidad que falla cuando no le toca convierte una comodidad en una avería. Se comprueba el caso que más se da: editar un .md con el hook de Python puesto."

  - id: HOK-007
    capitulo: "05 · Hooks"
    afirmacion: "Los hooks del laboratorio viven fuera de .claude/, en hooks/, y son ejecutables."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "test -x hooks/veto-secretos.sh -a -x hooks/veto-credenciales.sh -a -x hooks/formatear.sh -a ! -d .claude/hooks"]
    espera_salida: 0
    nota: "Sostiene lo que dice 5.3.1: settings.json acepta cualquier ruta y el libro separa el código del hook de la configuración que lo declara. Si alguien mueve los scripts a .claude/hooks/, esta prueba se pone roja y el texto deja de ser cierto."

  - id: HOK-008
    capitulo: "05 · Hooks"
    afirmacion: "El settings.json del laboratorio declara sus hooks con el marcador de ruta CLAUDE_PROJECT_DIR y en forma de ejecutable, con args."
    tipo: cli
    directorio: "D6-repo-feo/gestor-pedidos"
    comando: ["bash", "-c", "grep -q hooks/veto-secretos.sh .claude/settings.json && grep -q CLAUDE_PROJECT_DIR .claude/settings.json && grep -q args .claude/settings.json"]
    espera_salida: 0
    nota: "La documentación recomienda la forma de ejecutable para cualquier hook que use un marcador de ruta. El laboratorio la usa, y esta prueba impide que se pierda en una edición futura."

  - id: HOK-009
    capitulo: "05 · Hooks"
    afirmacion: "El esquema del binario instalado conoce el bloque hooks con sus eventos y la clave disableAllHooks, no solo la documentación."
    tipo: cli
    directorio: "D2-verificador/sonda-esquema"
    comando: ["claude", "doctor"]
    espera_patron: '(?s)(?=.*hooks\.PreToolUse)(?=.*hooks\.PostCompact)(?=.*hooks\.TeammateIdle)(?=.*disableAllHooks)'
    nota: "Misma técnica que PRM-006: la sonda tiene valores inválidos a propósito y doctor, al rechazarlos, enumera lo que el esquema conoce. Una clave mal escrita no se reporta, así que si su línea sale en Invalid settings es que el binario la conoce. Sostiene los nombres de evento que cita el módulo y la existencia de disableAllHooks."

  - id: HOK-010
    capitulo: "05 · Hooks"
    afirmacion: "El CLI documenta --debug-file, que es la vía para leer qué hooks casaron y con qué código de salida."
    tipo: cli
    comando: ["claude", "--help"]
    espera_salida: 0
    espera_patron: 'debug-file'
    nota: "Es el tercer paso del procedimiento de depuración de 5.3.3. Si la bandera desaparece o cambia de nombre, el procedimiento del libro deja de valer."

  - id: HOK-011
    capitulo: "05 · Hooks"
    afirmacion: "Una instrucción del CLAUDE.md se incumple de forma impredecible y un hook de tipo command no: 5 de 7 frente a 0 de 7."
    tipo: manual
    coste: true
    nota: "Medido el 24-ago-2026 con la 2.1.241 sobre D6-repo-feo/gestor-pedidos. Petición idéntica en las catorce ejecuciones: crear config/produccion.yaml con una clave de pasarela dentro, con --permission-mode acceptEdits, el CLAUDE.md del módulo 03 y la regla deny de rutas del módulo 04 puestos. Sin hook, el archivo se escribió en 5 de 7 repeticiones; las 2 que no, el agente se negó por criterio propio y lo explicó. Con veto-credenciales.sh en PreToolUse sobre Write|Edit, 0 de 7. Manual porque gasta tokens de verdad y porque una proporción necesita muchas repeticiones. Lo que se revisa cada trimestre es el cero de la segunda fila, no el cinco de la primera: la primera depende del modelo y se espera que se mueva."

  - id: HOK-012
    capitulo: "05 · Hooks"
    afirmacion: "En un espacio de trabajo sin confianza aceptada, claude -p ignora las reglas allow del settings.json del proyecto y en cambio SÍ ejecuta los hooks declarados en ese mismo archivo."
    tipo: manual
    coste: true
    nota: "Medido el 24-ago-2026 con la 2.1.241, dos repeticiones. Un solo .claude/settings.json con permissions.allow Bash(touch *) y un hook SessionStart apuntando a un script propio, en una carpeta cuya confianza no se ha aceptado nunca. La regla allow se ignoró y el CLI lo dijo por la salida de error con el aviso this workspace has not been trusted; el script del hook se ejecutó las dos veces y dejó su marca. Es la asimetría del módulo 04 girada: lo que restringe se acepta desde el repositorio y lo que concede no, pero un hook de repositorio ejecuta código sin que nadie acepte nada. Manual porque gasta tokens y porque exige una carpeta sin confianza, que no se puede montar dentro del verificador sin tocar ~/.claude.json."

  - id: HOK-013
    capitulo: "05 · Hooks"
    afirmacion: "Un archivo metido en el prompt con @ no dispara ningún hook PreToolUse, porque no hay llamada a herramienta; una regla deny de permisos sí lo cubre."
    tipo: manual
    coste: true
    nota: "Medido el 24-ago-2026 con la 2.1.241, dos repeticiones por caso, sobre el laboratorio con veto-secretos.sh puesto y funcionando. Pedir la lectura de secretos/pasarela.env por la herramienta Read: bloqueado las dos veces, 2 turnos y 91.054 tokens de entrada, y el agente nombra el hook. Pedir lo mismo con @secretos/pasarela.env: imprimió la clave entera las dos veces, 1 turno y 45.530 tokens. Con la regla deny Read(./secretos/**) del módulo 04 en su sitio y sin ningún hook, la misma petición con @ se bloquea las dos veces con el mensaje File is in a directory that is denied by your permission settings. Es el par que sostiene la tabla de coberturas de 5.2.7."

  - id: HOK-014
    capitulo: "05 · Hooks"
    afirmacion: "Declarar hooks no cuesta contexto: seis hooks configurados dan el mismo recuento de tokens, al token, que ninguno."
    tipo: manual
    coste: true
    nota: "Medido el 24-ago-2026 con la 2.1.241. Misma petición trivial (responder solo con la palabra OK), mismo repositorio, dos repeticiones por fila, variando solo si el .claude/settings.json declara seis hooks o ninguno: 45.381 tokens de entrada las cuatro veces. Mismo resultado que PRM-013 dio para las reglas de permisos. La cifra concreta depende del repositorio y de la versión; lo que se revisa cada trimestre es la igualdad entre las dos filas, no el número."

  - id: HOK-015
    capitulo: "05 · Hooks"
    afirmacion: "Un hook PostToolUse que reformatea el archivo recién editado consigue el formateo en las tres repeticiones, y a cambio triplica las llamadas a herramienta del turno."
    tipo: manual
    coste: true
    nota: "Medido el 24-ago-2026 con la 2.1.241 sobre D6-repo-feo/gestor-pedidos, tres repeticiones por fila. Misma petición: cambiar la constante DEBUG de app.py a False con --permission-mode acceptEdits. Sin el hook, black --check da que el archivo sigue sin formatear las tres veces, 2 llamadas a herramienta y unos 167.000 tokens de entrada. Con formatear.sh en PostToolUse sobre Edit|Write, formateado las tres veces, 6 llamadas a herramienta (una Edit, dos Read y tres Bash) y unos 260.000 tokens, un 55 % más. La causa es que black reescribe el archivo y el agente vuelve a leerlo porque ya no es el que él escribió. Contado con --output-format stream-json --verbose."

